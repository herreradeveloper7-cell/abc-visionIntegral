<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 100" preserveAspectRatio="none">
  <defs>
    <linearGradient id="graphite-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a0b" />
      <stop offset="0.24" stop-color="#24272a" />
      <stop offset="0.5" stop-color="#414448" />
      <stop offset="0.76" stop-color="#1d1f22" />
      <stop offset="1" stop-color="#08090a" />
    </linearGradient>

    <linearGradient id="silver-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303337" />
      <stop offset="0.18" stop-color="#777c81" />
      <stop offset="0.38" stop-color="#f4f6f7" />
      <stop offset="0.52" stop-color="#9ca1a5" />
      <stop offset="0.72" stop-color="#e7eaec" />
      <stop offset="1" stop-color="#45494d" />
    </linearGradient>

    <linearGradient id="graphite-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020303" />
      <stop offset="0.38" stop-color="#25282b" />
      <stop offset="0.62" stop-color="#090a0b" />
      <stop offset="1" stop-color="#000" />
    </linearGradient>

    <linearGradient id="orange-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#542000" />
      <stop offset="0.2" stop-color="#a83d00" />
      <stop offset="0.46" stop-color="#f2790b" />
      <stop offset="0.62" stop-color="#ba4300" />
      <stop offset="0.82" stop-color="#ff8b17" />
      <stop offset="1" stop-color="#692400" />
    </linearGradient>

    <linearGradient id="electric-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a00" />
      <stop offset="0.44" stop-color="#fff0b5" />
      <stop offset="0.58" stop-color="#ffb126" />
      <stop offset="1" stop-color="#ff5a00" />
    </linearGradient>

    <linearGradient id="silver-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.48" stop-color="#fff" stop-opacity="0.72" />
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.08" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>

    <filter id="orange-glow" x="-100%" y="-20%" width="300%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="scale(1.25 1)">
  <!-- Grafito principal -->
  <path d="M240 0H332L92 100H0Z" fill="url(#graphite-main)" />
  <path d="M243 0H247L7 100H3Z" fill="#73777b" opacity="0.2" />

  <!-- Plata metalizada -->
  <path d="M332 0H386L146 100H92Z" fill="url(#silver-metal)" />
  <path d="M332 0H338L98 100H92Z" fill="#fff" opacity="0.28" />
  <path d="M346 0H363L123 100H106Z" fill="url(#silver-glint)" opacity="0.72" />
  <path d="M382 0H386L146 100H142Z" fill="#111315" opacity="0.38" />

  <!-- Segunda franja de grafito -->
  <path d="M386 0H416L176 100H146Z" fill="url(#graphite-dark)" />
  <path d="M387 0H390L150 100H147Z" fill="#696d70" opacity="0.22" />

  <!-- Naranja metalizado -->
  <path d="M416 0H472L232 100H176Z" fill="url(#orange-metal)" />
  <path d="M419 0H424L184 100H179Z" fill="#ff9a27" opacity="0.35" />

  <!-- Línea naranja eléctrica -->
  <path d="M472 0H480L240 100H232Z" fill="#ff6a00" opacity="0.65" filter="url(#orange-glow)" />
  <path d="M473.5 0H478L238 100H233.5Z" fill="url(#electric-orange)" />
  <path d="M474.5 0H476L236 100H234.5Z" fill="#fff4ce" opacity="0.92" />
  </g>
</svg>
